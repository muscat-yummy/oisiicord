<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#202024" />
    <title>Oisiicord</title>
    <link rel="icon" href="/app-icon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/community-ui.css" />
    <link rel="stylesheet" href="/community-settings.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/workspace-ui.css" />
    <link rel="stylesheet" href="/productivity.css" />
    <link rel="stylesheet" href="/developer-ui.css" />
    <link rel="stylesheet" href="/responsive.css" />
    <link rel="stylesheet" href="/global-search.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <section id="auth" class="auth">
      <div class="auth-card">
        <div class="brand">
          <img src="/app-icon" alt="" width="42" height="42" />
          <h1>Oisiicord</h1>
        </div>
        <h2 id="auth-title">ログイン</h2>
        <form id="auth-form">
          <label
            >ユーザー名<input
              id="username"
              name="username"
              autocomplete="username"
              pattern="[a-zA-Z0-9_]{3,32}"
              minlength="3"
              maxlength="32"
              required /></label
          ><label id="display-label" hidden
            >表示名<input
              id="display"
              maxlength="40"
              autocomplete="nickname" /></label
          ><label
            >パスワード<input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="12"
              maxlength="256"
              required
          /></label>
          <label id="invite-code-label" hidden
            >招待コード<input
              id="invite-code"
              name="invite-code"
              autocomplete="off"
              spellcheck="false"
          /></label>
          <p id="auth-error" role="alert" class="error"></p>
          <button id="auth-submit" class="primary" type="submit">
            ログイン
          </button>
        </form>
        <button id="auth-switch" class="link">アカウントを作成</button>
      </div>
    </section>
    <div id="workspace" class="workspace" hidden>
      <button
        id="panel-backdrop"
        aria-label="サイドパネルを閉じる"
        hidden
      ></button>
      <nav class="rail" aria-label="サーバー">
        <button id="home" class="rail-item logo" title="ダイレクトメッセージ">
          <img src="/app-icon" alt="DM" width="30" height="30" />
        </button>
        <div class="rail-divider"></div>
        <div id="guild-list"></div>
        <button
          id="add-guild"
          class="rail-item add"
          title="サーバー作成・招待から参加"
        ></button
        ><button
          id="security"
          class="rail-item security"
          title="ユーザー設定"
          hidden
        ></button>
      </nav>
      <aside class="sidebar">
        <header class="side-header">
          <button id="side-title">ダイレクトメッセージ</button
          ><button
            id="side-menu"
            class="icon-button"
            title="サーバーメニュー"
          ></button>
        </header>
        <div id="channel-list" class="channel-list"></div>
        <div id="voice-controls" class="voice-controls" hidden>
          <div class="voice-connection">
            <span id="voice-indicator"></span>
            <div>
              <strong id="voice-status">通話接続中</strong
              ><small id="voice-channel-name"></small>
            </div>
            <button
              id="hangup"
              class="icon-button danger"
              title="通話から退出"
            ></button>
          </div>
          <div class="voice-quick-controls">
            <button id="camera" class="voice-quick" title="カメラ"></button
            ><button id="share" class="voice-quick" title="画面共有"></button>
          </div>
        </div>
        <footer class="profile">
          <button id="my-profile" class="profile-person" title="プロフィール">
            <div id="my-avatar" class="avatar"></div>
            <div class="profile-name">
              <strong id="my-name"></strong
              ><small id="connection">接続中</small>
            </div>
          </button>
          <div class="profile-controls">
            <button
              id="mute"
              class="icon-button"
              title="マイクをミュート"
            ></button
            ><button
              id="deafen"
              class="icon-button"
              title="スピーカーをミュート"
            ></button
            ><button
              id="profile-settings"
              class="icon-button"
              title="ユーザー設定"
            ></button>
          </div>
        </footer>
      </aside>
      <main class="main">
        <header class="room-header">
          <button
            id="mobile-channels"
            class="icon-button"
            aria-label="チャンネルを表示"
          ></button
          ><span id="room-symbol" class="room-symbol"></span>
          <div class="room-heading">
            <h1 id="room-name">ダイレクトメッセージ</h1>
            <span id="room-topic"></span>
          </div>
          <div class="tools">
            <button
              id="call"
              class="icon-button"
              title="音声通話"
              hidden
            ></button
            ><button
              id="personal-tools"
              class="icon-button"
              title="自分用ツール"
            ></button
            ><button id="pins" class="icon-button" title="ピン留め"></button
            ><button
              id="toggle-members"
              class="icon-button"
              title="メンバー"
            ></button
            ><input
              id="search"
              class="search"
              type="search"
              aria-label="この会話を検索"
              placeholder="検索"
              title="Enterで横断検索"
            /><button
              id="global-search"
              class="icon-button"
              title="横断検索"
              aria-label="横断検索"
            ></button>
          </div>
        </header>
        <div id="mobile-toolbar" hidden></div>
        <div
          id="network-status"
          class="network-status"
          role="status"
          hidden
        ></div>
        <div
          id="history-status"
          class="history-status"
          role="status"
          hidden
        ></div>
        <div id="call-stage" class="call-stage" hidden></div>
        <div id="stage-controls" class="stage-controls" hidden>
          <button id="stage-mute" title="マイクをミュート"></button
          ><button id="stage-camera" title="カメラ"></button
          ><button id="stage-share" title="画面共有"></button
          ><button
            id="stage-hangup"
            title="通話から退出"
            class="danger"
          ></button>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div
          id="messages"
          class="messages"
          role="log"
          aria-label="メッセージ"
          aria-live="polite"
        ></div>
        <div id="typing" class="typing"></div>
        <div id="composer-area" class="composer-area" hidden>
          <div id="reply-bar" class="reply-bar" hidden></div>
          <div id="attachment-list"></div>
          <form id="composer" class="composer">
            <button
              id="attach"
              type="button"
              class="attach"
              title="ファイルを添付"
            ></button
            ><textarea
              id="message-input"
              rows="1"
              maxlength="8000"
              aria-label="メッセージ"
              placeholder="メッセージを送信"
            ></textarea
            ><button
              id="emoji"
              type="button"
              class="icon-button"
              title="絵文字"
            ></button
            ><button id="send" type="submit" title="送信"></button
            ><input id="file-input" type="file" multiple hidden />
          </form>
        </div>
      </main>
      <aside id="members-panel" class="members-panel">
        <h2>メンバー</h2>
        <div id="members"></div>
      </aside>
    </div>
    <div id="guild-menu" class="guild-menu" hidden></div>
    <dialog id="modal">
      <form id="modal-form">
        <header>
          <h2 id="modal-title"></h2>
          <button
            id="modal-close"
            class="icon-button"
            type="button"
            aria-label="閉じる"
          ></button>
        </header>
        <div id="modal-body"></div>
        <p id="modal-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="modal-cancel">キャンセル</button
          ><button id="modal-submit" type="submit" class="primary">保存</button>
        </footer>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
