<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171821" />
    <title>Oisiicord</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <section id="auth" class="auth">
      <div class="auth-card">
        <div class="brand">
          <img src="/icon.svg" alt="" width="42" height="42" />
          <h1>Oisiicord</h1>
        </div>
        <h2 id="auth-title">ログイン</h2>
        <form id="auth-form">
          <label
            >ユーザー名<input
              id="username"
              name="username"
              autocomplete="username"
              pattern="[a-zA-Z0-9_]{3,32}"
              minlength="3"
              maxlength="32"
              required
              placeholder="半角英数字・_" /></label
          ><label id="display-label" hidden
            >表示名<input
              id="display"
              maxlength="40"
              autocomplete="nickname" /></label
          ><label
            >パスワード<input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="12"
              maxlength="256"
              required
          /></label>
          <p id="auth-error" role="alert" class="error"></p>
          <button id="auth-submit" class="primary" type="submit">
            ログイン
          </button>
        </form>
        <button id="auth-switch" class="link">アカウントを作成</button>
        <p class="help">
          パスワードを忘れると会話の復号鍵を取り戻せない。12文字以上で設定して。
        </p>
      </div>
    </section>
    <div id="workspace" class="workspace" hidden>
      <nav class="rail" aria-label="サーバー">
        <button id="home" class="rail-item logo" title="ダイレクトメッセージ">
          <img src="/icon.svg" alt="DM" width="30" height="30" />
        </button>
        <div class="rail-divider"></div>
        <div id="guild-list"></div>
        <button
          id="add-guild"
          class="rail-item add"
          title="サーバー作成・招待から参加"
        >
          ＋</button
        ><button
          id="security"
          class="rail-item security"
          title="鍵・セキュリティ設定"
        >
          ◇
        </button>
      </nav>
      <aside class="sidebar">
        <header class="side-header">
          <button id="side-title">ダイレクトメッセージ</button
          ><button id="side-menu" class="icon-button" title="サーバー設定">
            ⌄
          </button>
        </header>
        <div id="channel-list" class="channel-list"></div>
        <div id="voice-controls" class="voice-controls" hidden>
          <span id="voice-status">音声接続中</span>
          <div>
            <button id="mute" title="マイクをミュート">マイク</button
            ><button id="camera">カメラ</button
            ><button id="share">画面共有</button
            ><button id="hangup" class="danger">退出</button>
          </div>
        </div>
        <footer class="profile">
          <div id="my-avatar" class="avatar"></div>
          <div class="profile-name">
            <strong id="my-name"></strong><small id="connection">接続中</small>
          </div>
          <button
            id="profile-settings"
            class="icon-button"
            title="ユーザー設定"
          >
            ⚙
          </button>
        </footer>
      </aside>
      <main class="main">
        <header class="room-header">
          <button
            id="mobile-channels"
            class="icon-button"
            aria-label="チャンネルを表示"
          >
            ☰</button
          ><span id="room-symbol" class="room-symbol">@</span>
          <div class="room-heading">
            <h1 id="room-name">ダイレクトメッセージ</h1>
            <span id="encryption-status" class="encrypted">端末間暗号化</span>
          </div>
          <div class="tools">
            <button id="call" class="icon-button" title="音声通話" hidden>
              通話</button
            ><button id="pins" class="icon-button" title="ピン留め">ピン</button
            ><button id="toggle-members" class="icon-button" title="メンバー">
              メンバー</button
            ><input
              id="search"
              class="search"
              type="search"
              aria-label="復号済みメッセージを検索"
              placeholder="この会話を検索"
            />
          </div>
        </header>
        <div id="call-stage" class="call-stage" hidden></div>
        <div id="notice" class="notice" hidden></div>
        <div
          id="messages"
          class="messages"
          role="log"
          aria-label="メッセージ"
          aria-live="polite"
        ></div>
        <div id="typing" class="typing"></div>
        <div id="composer-area" class="composer-area" hidden>
          <div id="reply-bar" class="reply-bar" hidden></div>
          <div id="attachment-list"></div>
          <form id="composer" class="composer">
            <button
              id="attach"
              type="button"
              class="attach"
              title="ファイル添付"
            >
              ＋</button
            ><textarea
              id="message-input"
              rows="1"
              maxlength="8000"
              aria-label="メッセージ"
              placeholder="メッセージを送信"
            ></textarea
            ><button
              id="emoji"
              type="button"
              class="icon-button"
              title="絵文字"
            >
              ☺</button
            ><button id="send" type="submit" title="送信">送信</button
            ><input id="file-input" type="file" multiple hidden />
          </form>
          <div class="composer-help">
            Enter で送信・Shift + Enter で改行<span
              >本文・添付・通話は端末で暗号化</span
            >
          </div>
        </div>
      </main>
      <aside id="members-panel" class="members-panel">
        <h2>メンバー</h2>
        <div id="members"></div>
      </aside>
    </div>
    <dialog id="modal">
      <form id="modal-form">
        <header>
          <h2 id="modal-title"></h2>
          <button
            id="modal-close"
            class="icon-button"
            type="button"
            aria-label="閉じる"
          >
            ×
          </button>
        </header>
        <div id="modal-body"></div>
        <p id="modal-error" class="error" role="alert"></p>
        <footer>
          <button type="button" id="modal-cancel">閉じる</button
          ><button id="modal-submit" type="submit" class="primary">保存</button>
        </footer>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
